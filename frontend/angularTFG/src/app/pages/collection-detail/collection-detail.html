<div class="detail-container">

  <button class="back-btn" (click)="goBack()">←</button>

  <h2 class="title">Mi colección</h2>

  @if (selectedBox) {

    <div class="info-box">

      <div class="image-container">
        <img [src]="selectedBox.imageUrl" [alt]="selectedBox.descripcion" />
      </div>

      <p>{{ selectedBox.descripcion }}</p>

      <p>Total: {{ selectedBox.total }}</p>

      <p>Repetidos: {{ selectedBox.repeated }}</p>

      @if (selectedBox.hasSpecial) {
        <p>⭐ Especial</p>
      }

    </div>

  } @else {

    <p class="empty">No se encontró el coleccionable.</p>

  }

</div>
