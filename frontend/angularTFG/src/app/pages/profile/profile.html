<div class="profile-container">

    <button class="back-btn" (click)="goBackHome()">←</button>
    <button class="settings-btn" (click)="goToSettings()">Ajustes ⚙</button>

    <div class="profile-content">

        <div class="avatar-section">
            <div class="profilePicture-section">
                <img [src]="'images/' + profilePicture + '.png'" class="profilePicture" />
            </div>

            <h2 class="username">{{username}}</h2>
        </div>

        <div class="stats-box">

            @if (datosCargados == false) {
            <p>Cargando datos...</p>
            } @else {
            <div class="stat">{{ boxesCount }} cajas abiertas</div>
            <div class="stat">{{ specialCount }} especiales</div>
            <div class="stat">{{ tradesCount }} intercambios</div>
            }

        </div>

        <div class="actions">
            <button class="btn tienda" (click)="goToStatistics()">Mi actividad</button>
            <button class="btn coleccion" (click)="goToCollection()">Mis colecciones</button>
            <button class="btn logros" (click)="goToAchievements()">Mis logros</button>
        </div>

    </div>

</div>
