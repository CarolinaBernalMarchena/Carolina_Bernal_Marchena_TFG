<div class="modal-backdrop" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    @if (imageUrl) {
    <img class="modalImage" [src]="imageUrl" />
    <ngx-confetti-explosion></ngx-confetti-explosion>
    }
    <p>{{ message }}</p>

    <button (click)="close()">Aceptar</button>
  </div>
</div>
