<div class="login-container">
    <div class="logo">
        <div class="logo-box"></div>
        <h1>TrinketBox</h1>
  </div>
    <form class="login-form" (ngSubmit)="login(email, password)">
    
        <div class="input-group">
        <input 
            type="email" 
            placeholder="Email"
            [(ngModel)]="email"
            name="email"
            required
        />
        </div>

        <div class="input-group">
        <input 
            type="password" 
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            required
        />
        </div>

        <button type="submit">
        Iniciar sesión
        </button>
    </form>

    <a class="register-link" (click)="navigateToRegister()">¿No tienes cuenta? Regístrate aquí</a>

</div>
