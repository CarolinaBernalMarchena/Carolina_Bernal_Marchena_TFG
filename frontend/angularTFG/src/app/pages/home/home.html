<body style="margin-top: 0%;">
    <button class="logout" (click)="logout()">
        Cerrar sesión ✕
    </button>

    <div class="home-container">
        <h1 class="title">TrinketBox</h1>

        <div class="welcome-card">
            <div class="profilePicture-home">
                <img [src]="'images/' + profilePicture + '.png'" class="profilePicture" alt="profile picture" />
            </div>
            <div class="welcome-text">
                <h2>{{ username }}</h2>
                <p>Bienvenid@ de nuevo!</p>
            </div>
        </div>

        <div class="intercambios" (click)="goToTrades()">
            <span class="icon">🔄</span>
            <div>
                <h3>Intercambios</h3>
                <p>Gestiona y consulta tus intercambios</p>
            </div>
        </div>

        <div class="actions">
            <div class="card tienda" (click)="goToShop()">
                <span class="icon">🛒</span>
                <span class="card-title">Tienda</span>
                <span class="card-subtitle">Compra nuevos coleccionables</span>
            </div>

            <div class="card coleccion" (click)="goToCollection()">
                <span class="icon">📚</span>
                <span class="card-title">Mis colecciones</span>
                <span class="card-subtitle">Gestiona tu colección</span>
            </div>

            <div class="card perfil" (click)="goToProfile()">
                <span class="icon">👤</span>
                <span class="card-title">Mi perfil</span>
                <span class="card-subtitle">Consulta tus estadísticas</span>
            </div>
        </div>

    </div>

    <app-chatbot></app-chatbot>
</body>
