<div class="chat-container">

    <div *ngFor="let msg of messages" 
        class="bubble"
        [class.user]="msg.from === 'user'"
        [class.bot]="msg.from === 'bot'">
        {{ msg.text }}
    </div>

</div>

<!-- botón temporal para probar -->
@for (mensaje of opcionesMensajes; track $index) {
<button (click)="enviarMensaje(mensaje, 'user')">{{mensaje}}</button>
}
