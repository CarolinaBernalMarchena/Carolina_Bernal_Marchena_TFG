<div class="detail-container">

  <button class="back-btn" (click)="goBack()">←</button>

  <h2 class="title">Mi colección</h2>

  <div *ngFor="let box of collection" class="info-box">

    <div class="image-container">
      <img [src]="box.imageUrl" [alt]="box.descripcion" />
    </div>

    <p>{{ box.descripcion }}</p>

    <p>Total: {{ box.total }}</p>

    <p>Repetidos: {{ box.repetido }}</p>

    <p *ngIf="box.hasSpecial">⭐ Especial</p>

  </div>

</div>
