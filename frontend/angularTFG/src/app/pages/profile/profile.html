<div class="profile-container">

    <div class="profile-header">

        <button class="back-btn" (click)="goBackHome()">← Volver</button>

        <h2 class="page-title">Perfil</h2>

        <button class="settings-btn" (click)="goToSettings()">⚙ Ajustes</button>

    </div>

    <div class="profile-content">

        <div class="avatar-section">
            <div class="profilePicture-section">
                <img [src]="'images/' + profilePicture + '.png'" class="profilePicture" />
            </div>

            <h2 class="username">{{ username }}</h2>
        </div>

        <div class="stats-box">

            @if (datosCargados == false) {

            <p>Cargando datos...</p>

            } @else {

            <h3 class="stats-title">Estadísticas</h3>

            <div class="stat-row">
                <span>📦 Cajas abiertas</span>
                <strong>{{ boxesCount }}</strong>
            </div>

            <div class="stat-row">
                <span>⭐ Especiales</span>
                <strong>{{ specialCount }}</strong>
            </div>

            <div class="stat-row">
                <span>🔄 Intercambios</span>
                <strong>{{ tradesCount }}</strong>
            </div>

            }

        </div>

        <div class="actions">
            <button class="btn actividad" (click)="goToStatistics()">
                📊
                <span>Mi actividad</span>
            </button>

            <button class="btn logros" (click)="goToAchievements()">
                🏆
                <span>Mis logros</span>
            </button>
        </div>

    </div>

</div>
