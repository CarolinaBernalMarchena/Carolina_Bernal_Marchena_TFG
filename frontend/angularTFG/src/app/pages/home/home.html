<body style="margin-top: 0%;">
    <button class="logout" (click)="logout()">
        Cerrar sesión ✕
    </button>

    <div class="home-container">
        <h1 class="title">TrinketBox</h1>

        <div class="welcome-card">
            <div class="avatar"></div>
            <div class="welcome-text">
            <h2>{{ username }}</h2>
            <p>Bienvenid@ de nuevo!</p>
            </div>
        </div>

        <div class="intercambios" (click)="goToTrades()">
            Intercambios
        </div>

        <div class="actions">
            <div class="card tienda" (click)="goToShop()">Tienda</div>
            <div class="card coleccion" (click)="goToCollection()">Mi colección</div>
            <div class="card perfil" (click)="goToProfile()">Mi perfil</div>
        </div>

    </div>

    <app-chatbot></app-chatbot>
</body>
