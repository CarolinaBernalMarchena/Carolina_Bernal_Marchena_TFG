<div class="market-wrapper">

  <button class="back-btn" (click)="goBackHome()">←</button>
  <h1>Mercado de intercambios</h1>

  @if (filteredTrades.length === 0) {
  <div class="empty-state">
    No hay intercambios disponibles.
  </div>
  }

  <button class="create-trade" (click)="createTrade()">
    Crear nuevo intercambio
  </button>

  <form class="filters-form">

    <div class="filter-group select-group">
      <label class="filter-label">Filtrar por colección ofrecida</label>

      <select [(ngModel)]="selectedCollection" name="collection" (change)="applyFilters()">

        <option value="all">Todas las colecciones</option>

        @for (col of collections; track col.name) {
        <option [value]="col.name" [disabled]="col.count === 0">
          {{ col.name }} ({{ col.count }})
        </option>
        }

      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Filtros especiales</label>

      <div class="toggle-group">

        <button type="button" class="toggle-pill" [class.active]="onlySpecialBoxes"
          (click)="onlySpecialBoxes = !onlySpecialBoxes; applyFilters()">
          💎 Coleccionables especiales
        </button>

        <button type="button" class="toggle-pill" [class.active]="onlyPlatformTrades"
          (click)="onlyPlatformTrades = !onlyPlatformTrades; applyFilters()">
          ⭐ Intercambios especiales
        </button>

      </div>
    </div>

  </form>

  @for (trade of filteredTrades; track trade.id) {

  @if (trade.ownerId == 0) {
  <app-special-trade-card [trade]="trade" (tradeEnded)="tradeEnded()">
  </app-special-trade-card>
  } @else {
  <app-trade-card [trade]="trade" (tradeEnded)="tradeEnded()">
  </app-trade-card>
  }

  }

</div>
