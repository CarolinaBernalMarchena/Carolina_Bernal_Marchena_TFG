<div class="chat-container">
    @for (msg of messages; track msg) {
        <div 
        class="bubble"
        [class.user]="msg.from === 'user'"
        [class.bot]="msg.from === 'bot'">
        {{ msg.text }}
        </div>
    }
</div>
<div class="divider"></div>

@for (mensaje of opcionesMensajes; track $index) {
<button style="font: oblique bold 80% cursive;" (click)="enviarMensaje(mensaje, 'user')">{{mensaje}}</button>
}
